[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-raytrace"
version = "0.1.0"
description = "Minimal geometric optical ray tracer for surfaces, mirrors and materials"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["raytrace*"]

